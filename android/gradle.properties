# -Xmx4G: the template's 8G heap triggers Windows "insufficient system
# resources" IO failures on mid-RAM machines; 4G is ample for this app.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Jetifier off: every native plugin here (rive_common, sqlite3_flutter_libs,
# just_audio, audio_session, path_provider) is AndroidX-native, and Jetifier's
# jar transform is what failed with ERROR_NO_SYSTEM_RESOURCES on Windows.
android.enableJetifier=false
